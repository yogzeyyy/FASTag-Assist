<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FASTag Assist</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:350px;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#0066cc;
}

input{
    width:90%;
    padding:12px;
    font-size:17px;
    border-radius:8px;
    border:1px solid gray;
    margin-top:20px;
}

button{
    margin-top:20px;
    width:95%;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#007BFF;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#status{
    margin-top:20px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>FASTag Assist</h1>

<p>Enter your Message</p>

<input
type="text"
id="message"
placeholder="Type message here">

<button onclick="sendMessage()">

Send Message

</button>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, set }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBPvmrLS62YTQBNlP3vvnDb_GmJRneWCrk",

authDomain: "fastag-assist.firebaseapp.com",

databaseURL: "https://fastag-assist-default-rtdb.firebaseio.com",

projectId: "fastag-assist",

storageBucket: "fastag-assist.firebasestorage.app",

messagingSenderId: "87488837301",

appId: "1:87488837301:web:c3f938b1b46c21ae61b0fc"

};

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);

window.sendMessage = function(){

let msg = document.getElementById("message").value;

if(msg=="")
{
alert("Please enter a message");
return;
}

set(ref(database,"Message"),{

text:msg,

time:new Date().toLocaleString()

})

.then(()=>{

document.getElementById("status").innerHTML="✅ Message Sent Successfully";

document.getElementById("message").value="";

})

.catch((error)=>{

alert(error);

});

}

</script>

</body>
</html>
